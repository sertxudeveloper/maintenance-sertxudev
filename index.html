<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Down for maintenance — Sertxu</title>
    <meta name="description" content="The site is temporarily down for scheduled maintenance. Please check back shortly.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0c">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.bunny.net">
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=archivo:600,700|dm-sans:400,500,700|dm-mono:400&display=swap">

    <style>
        :root {
            --coral: #FF3047;
            --ocean: #0035FF;
            --bg: #0a0a0c;
            --fg: #d6d3d1;
            --muted: #a8a29e;
            --dim: #57534e;
            --border: #1c1917;
            --panel: #111113;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(at center center, #1e1e22 0.75px, transparent 0.75px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 9999px;
            pointer-events: none;
        }

        .glow-coral {
            top: -250px;
            right: -250px;
            background: radial-gradient(circle, rgba(255, 48, 71, 0.08) 0%, transparent 65%);
        }

        .glow-ocean {
            bottom: -250px;
            left: -250px;
            background: radial-gradient(circle, rgba(0, 53, 255, 0.08) 0%, transparent 65%);
        }

        .grain {
            position: fixed;
            inset: 0;
            opacity: 0.025;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        main {
            position: relative;
            width: 100%;
            max-width: 44rem;
            text-align: center;
        }

        .terminal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            overflow: hidden;
            text-align: left;
            margin-bottom: 2.5rem;
        }

        .terminal-bar {
            background: rgba(10, 10, 12, 0.5);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dot { width: 0.75rem; height: 0.75rem; border-radius: 9999px; display: inline-block; }
        .dot-red { background: #f87171; }
        .dot-amber { background: #fbbf24; }
        .dot-green { background: #22c55e; }

        .terminal-body {
            padding: 1.25rem 1rem;
            font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.8125rem;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        @media (min-width: 640px) {
            .terminal-body { font-size: 0.875rem; }
        }

        .prompt { color: var(--muted); }
        .prompt .user { color: #4ade80; }
        .prompt .path { color: var(--dim); }
        .prompt .cmd { color: #d6d3d1; }

        .output { color: #a8a29e; padding-left: 1.25rem; }
        .output .marker { color: var(--dim); font-size: 10px; }
        .output .accent { color: var(--coral); }
        .output .info { color: #e7e5e4; }

        .cursor {
            display: inline-block;
            width: 0.5rem;
            height: 1rem;
            background: #a8a29e;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        h1 {
            font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
            font-weight: 700;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.1;
            color: #e7e5e4;
            margin: 0 0 1.25rem;
        }

        .rule {
            display: block;
            width: 4rem;
            height: 2px;
            border-radius: 9999px;
            background: var(--coral);
            margin: 0 auto 1.5rem;
        }

        p {
            margin: 0 auto;
            max-width: 34rem;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .eta {
            margin-top: 1.25rem;
            font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.875rem;
            color: var(--dim);
        }

        footer {
            margin-top: 3rem;
            font-size: 0.8125rem;
            color: var(--dim);
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover { color: var(--coral); }

        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
        }
    </style>
</head>
<body>
    <div class="grid" aria-hidden="true"></div>
    <div class="glow glow-coral" aria-hidden="true"></div>
    <div class="glow glow-ocean" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main>

        <div class="mx-auto" style="margin-bottom: 2rem;">
            <svg width="56" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M228.794 115.211C226.897 118.732 221.838 118.711 219.971 115.174L175.841 31.5863C174.083 28.2565 176.497 24.252 180.262 24.252L269.422 24.252C273.206 24.252 275.619 28.2922 273.824 31.6233L228.794 115.211Z" fill="#FF3047"/>
                <path d="M49.0014 164.789C50.8985 161.268 55.9574 161.289 57.8249 164.826L101.955 248.414C103.713 251.743 101.298 255.748 97.533 255.748L8.37301 255.748C4.58919 255.748 2.17654 251.708 3.97112 248.377L49.0014 164.789Z" fill="#FF3047"/>
                <path d="M4.38445 31.5634C2.64905 28.2346 5.06415 24.252 8.81812 24.252H153.535C155.382 24.252 157.078 25.2697 157.947 26.899L276.078 248.395C277.855 251.726 275.441 255.748 271.667 255.748H124.292C122.428 255.748 120.72 254.712 119.858 253.059L4.38445 31.5634Z" fill="#0035FF"/>
            </svg>
        </div>

        <h1>Down for maintenance</h1>
        <span class="rule"></span>

        <p>
            I'm performing some scheduled work on the server. The site will be back online shortly.
            Thanks for your patience.
        </p>
        
        <div class="terminal" style="margin-top: 4rem;">
            <div class="terminal-bar" aria-hidden="true">
                <span class="dot dot-red"></span>
                <span class="dot dot-amber"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="terminal-body">
                <div class="prompt">
                    <span class="user">sertxu@eu-south-2</span><span class="path">:~$</span>
                    <span class="cmd">systemctl status sertxu.dev</span>
                </div>
                <div class="output">
                    <div><span class="marker">▶</span> <span class="accent">Scheduled maintenance in progress</span></div>
                    <div><span class="marker">▶</span> <span class="info">Server is temporarily offline</span> <span class="cursor"></span></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
